[swift]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[terraform]
format = '\[[$symbol$workspace]($style)\] '

[time]
format = '\[[$time]($style)\] '

[hostname]
style = "bold cyan"

[username]
style_user = "bold yellow"
style_root = "bold red"
format = '\[[$user]($style)\] '

[vagrant]
format = '\[[$symbol($version)]($style)\] '

[vlang]
format = '\[[$symbol($version)]($style)\] '

[zig]
