add_newline = false

format = "$username$hostname$directory$all$character"
palette = "punchy"

#--------------------------------PROMPT----------------------------------

[palettes.punchy]
black = "#1b1d23"
red = "#ff5c57"
green = "#62e36e"
yellow = "#ffd166"
orange = "#ff9f43"
blue = "#4da3ff"
purple = "#d66efd"
cyan = "#2de2e6"
white = "#e6e6e6"
"bright-black" = "#7f849c"
"bright-red" = "#ff6b66"
"bright-green" = "#69ff97"
"bright-yellow" = "#ffe27a"
"bright-blue" = "#69ceff"
"bright-purple" = "#d9a0ff"
"bright-cyan" = "#7de3ff"
"bright-white" = "#ffffff"


[line_break]
disabled = true

[character]
success_symbol = "[λ](bold green)"
error_symbol = "[λ](bold red)"

#--------------------------------SYMBOLS---------------------------------
[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\] '
symbol = "  "

[bun]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[c]
symbol = " "
format = '\[[$symbol($version(-$name))]($style)\] '

[cmake]
format = '\[[$symbol($version)]($style)\] '

[cmd_duration]
style = "bold orange"
format = '\[[⏱ $duration]($style)\] '

[cobol]
format = '\[[$symbol($version)]($style)\] '

[conda]
format = '\[[$symbol$environment]($style)\] '

[crystal]
format = '\[[$symbol($version)]($style)\] '

[daml]
format = '\[[$symbol($version)]($style)\] '

[dart]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[directory]
style = "bold blue"
format = '[$path]($style) '
read_only = " 🔒"
truncation_length = 2
truncate_to_repo = false
truncation_symbol = ""
home_symbol = "~"

[deno]
format = '\[[$symbol($version)]($style)\] '

[docker_context]
format = '\[[$symbol$context]($style)\] '

[dotnet]
format = '\[[$symbol($version)(🎯 $tfm)]($style)\] '

[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\] '

[elm]
format = '\[[$symbol($version)]($style)\] '

[erlang]
format = '\[[$symbol($version)]($style)\] '

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\] '

[git_branch]
symbol = " "
style = "bold purple"
format = '\[[$symbol$branch]($style)\]'

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style)) '

[golang]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[haskell]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[helm]
format = '\[[$symbol($version)]($style)\] '

[hg_branch]
format = '\[[$symbol$branch]($style)\] '

[java]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[julia]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[kotlin]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[kubernetes]
symbol = "☸  "
format = '\[[$symbol$context( \($namespace\))]($style)\] '

[lua]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[memory_usage]
symbol = " "
format = '\[$symbol[$ram( | $swap)]($style)\] '

[nim]
symbol = " "
format = '\[[$symbol($version)]($style)\] '

[nix_shell]
symbol = " "
format = '\[[$symbol$state( \($name\))]($style)\] '

[nodejs]
symbol = " "
style = "bold green"
format = '\[[$symbol($version)]($style)\] '

[ocaml]
format = '\[[$symbol($version)(\($switch_indicator$switch_name\))]($style)\] '

[openstack]
